# Engine-spoken text, Arabic.
#
# Keep every key in engine_en.properties present here. A missing key falls back
# to the base bundle, which means an Arabic conversation emits one English
# sentence and reads as a glitch rather than as a missing translation.

step.userInput.waiting          = في انتظار إدخالك: {0}
step.userInput.confirm          = لقد قرأت ما أدخلته. يرجى مراجعة التفاصيل أدناه وتأكيدها.
step.userInput.prefillConfirm    = هل تقصد “{0}”؟ أجب بنعم للمتابعة، أو لا لاختيار غيره.

step.approval.prompt            = يرجى التأكيد للمتابعة. أجب بالموافقة أو الرفض.
step.approval.promptStakeholder = بانتظار موافقة: {0}. أجب بالموافقة أو الرفض.
step.approval.unclear           = لم أتمكن من تحديد ما إذا كانت هذه موافقة. يرجى الرد بالموافقة أو الرفض.
step.approval.rejected          = تم رفض الطلب.
step.approval.timedOut          = انتهت مهلة طلب الموافقة وتم رفضه تلقائيًا.
step.approval.granted           = تمت الموافقة على الطلب.

# Accepted decision words. Comma-separated, lower case, no regex.
#
# Pooled with every other locale's list at startup, so an Arabic conversation
# still accepts "ok". Keep these disjoint from the reject list — a word claimed
# by both is dropped at startup and stops counting as a decision at all.
step.approval.approveWords      = نعم, موافق, أوافق, اوافق, تم, قبول, مقبول, موافقة, أكد, اكد, تمام
step.approval.rejectWords       = لا, رفض, أرفض, ارفض, مرفوض, غير موافق, إلغاء, الغاء, ألغِ

step.knowledge.noAnswer         = لا تتوفر لدي معلومات حول هذا الموضوع.

run.error.generic               = حدث خطأ أثناء معالجة طلبك. يرجى المحاولة مرة أخرى.
run.noSteps                     = لا توجد خطوات معدّة لهذه الرحلة.
